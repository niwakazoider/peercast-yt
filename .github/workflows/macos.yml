name: PeerCast YT Apple Silicon Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'macos/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check runner architecture
        run: test "$(uname -m)" = arm64

      - name: Install dependencies
        run: brew install pkg-config googletest openssl@3

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DUSE_RTMP=OFF

      - name: Build PeerCast and Web UI
        run: cmake --build build --target linux-bin html public --parallel 3

      - name: Package and verify arm64 executable
        run: |
          package=build/peercast-yt-macos-arm64
          mkdir -p "$package/bin" "$package/share/peercast"
          cp build/peercast "$package/bin/"
          cp -R ui/assets ui/cgi-bin ui/html ui/public "$package/share/peercast/"
          cp -R ui/LICENSE licenses "$package/"
          file "$package/bin/peercast"
          test "$(lipo -archs "$package/bin/peercast")" = arm64
          otool -L "$package/bin/peercast"
          tar -czf build/peercast-yt-macos-arm64.tar.gz -C build peercast-yt-macos-arm64

      - name: Smoke test the packaged CLI and Web UI
        run: |
          tmp="$(mktemp -d)"
          tar -xzf build/peercast-yt-macos-arm64.tar.gz -C "$tmp"
          peercast="$tmp/peercast-yt-macos-arm64/bin/peercast"
          export XDG_CONFIG_HOME="$tmp/config"
          export XDG_CACHE_HOME="$tmp/cache"
          export XDG_STATE_HOME="$tmp/state"
          cd "$tmp"
          "$peercast" --help | grep -F 'Usage: peercast'
          cat > smoke.ini <<'INI'
          [Server]
          serverPort=17144
          autoServe=Yes
          autoConnect=No
          [End]
          INI
          "$peercast" --inifile "$tmp/smoke.ini" > peercast.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" || true; cat peercast.log' EXIT
          url=http://127.0.0.1:17144
          for attempt in {1..30}; do
            if curl --noproxy '*' --fail --silent --max-time 2 --location "$url/" -o index.html; then
              break
            fi
            kill -0 "$pid"
            sleep 1
          done
          grep -qi '<html' index.html
          grep -qi 'PeerCast' index.html
          curl --noproxy '*' --fail --silent --show-error --max-time 5 \
            "$url/assets/images/small-logo.png" -o small-logo.png
          cmp small-logo.png "$tmp/peercast-yt-macos-arm64/share/peercast/assets/images/small-logo.png"

      - name: Upload executable and Web UI
        uses: actions/upload-artifact@v4
        with:
          name: peercast-yt-macos-arm64
          path: build/peercast-yt-macos-arm64.tar.gz
          if-no-files-found: error
