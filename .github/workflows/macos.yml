name: PeerCast YT Apple Silicon Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix macOS header conflict
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          old = root / "core/common/_string.h"
          new = root / "core/common/peercast_string.h"

          old.rename(new)

          extensions = {".cpp", ".cc", ".c", ".h", ".hpp"}

          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue
              if not path.is_file():
                  continue
              if path.suffix not in extensions:
                  continue

              text = path.read_text(encoding="utf-8")
              if "_string.h" in text:
                  path.write_text(
                      text.replace(
                          "_string.h",
                          "peercast_string.h"
                      ),
                      encoding="utf-8"
                  )

          print("Header conflict fix applied")
          PY

      - name: Show environment
        run: |
          uname -a
          uname -m
          clang++ --version
          cmake --version

      - name: Install dependencies
        run: |
          brew install pkg-config googletest openssl@3

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DUSE_RTMP=OFF

      - name: Build PeerCast
        run: |
          cmake --build build \
            --target linux-bin \
            --parallel 1

      - name: Check binary
        run: |
          file build/peercast

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: peercast-yt-macos-arm64
          path: build/peercast
          if-no-files-found: error
